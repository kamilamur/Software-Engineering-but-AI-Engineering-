<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Campus</title><style>body{font:16px system-ui;background:#eef2f6;color:#172b40;margin:0}main{max-width:540px;margin:30px auto;background:white;padding:24px;border-radius:16px}label,input,button{display:block;margin:12px 0}input,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}button{background:#174d76;color:white;border:0;border-radius:8px} @media(max-width:600px){main{margin:12px}}</style><main><h1>Smart Campus Room A101</h1><p>Fictional bookings for tomorrow: 12:00–13:00 and 15:00–16:00 (local time).</p><label>Start time<input id="start" type="datetime-local"></label><label>Duration (minutes)<input id="duration" type="number" value="60"></label><label><input id="blocked" type="checkbox" style="display:inline"> Room blocked</label><button id="check">Check availability</button><p id="result" role="status"></p></main><script>
function validate(start,duration,now){if(!Number.isFinite(start)||start<=now)return 'INVALID_START';if(!Number.isFinite(duration)||duration<=0||duration>120)return 'INVALID_DURATION';return null;}
function decide(start,duration,blocked,bookings,now){const error=validate(start,duration,now);const reason=error||(blocked?'BLOCKED':bookings.some(([a,b])=>start<b&&start+duration*60000>a)?'OVERLAP':'FREE');return {available:reason==='FREE',reason};}
const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);const at=h=>new Date(tomorrow.getFullYear(),tomorrow.getMonth(),tomorrow.getDate(),h).getTime();const bookings=Object.freeze([[at(12),at(13)],[at(15),at(16)]].map(Object.freeze));const messages={FREE:'Available — Room is free.',BLOCKED:'Unavailable — Room is blocked.',OVERLAP:'Unavailable — Booking conflict.',INVALID_START:'Validation error: choose a future start time.',INVALID_DURATION:'Validation error: duration must be greater than 0 and at most 120 minutes.'};document.getElementById('check').onclick=()=>{const r=decide(new Date(document.getElementById('start').value).getTime(),Number(document.getElementById('duration').value),document.getElementById('blocked').checked,bookings,Date.now());document.getElementById('result').textContent=messages[r.reason];};
</script></html>
